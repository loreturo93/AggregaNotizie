name: diag-temporaneo
on:
  push:
    branches: [claude/news-aggregator-categories-wmzxue]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Candidati Corriere e Gazzetta
        run: |
          node -e '
          const {decodeXml,parseFeed}=require("./lib/parser");
          const urls=["https://www.corriere.it/dynamic-feed/rss/section/Cronache.xml","https://www.corriere.it/dynamic-feed/rss/section/Cronaca.xml","https://www.corriere.it/dynamic-feed/rss/section/Economia.xml","https://www.corriere.it/dynamic-feed/rss/section/Esteri.xml","https://www.corriere.it/dynamic-feed/rss/section/Sport.xml","https://www.corriere.it/dynamic-feed/rss/section/Cultura.xml","https://www.corriere.it/dynamic-feed/rss/section/Spettacoli.xml","https://www.corriere.it/dynamic-feed/rss/section/Tecnologia.xml","https://www.corriere.it/dynamic-feed/rss/section/Scienze.xml","https://www.corriere.it/dynamic-feed/rss/section/Salute.xml","https://www.corriere.it/dynamic-feed/rss/section/Animali.xml"];
          (async()=>{for(const u of urls){try{const r=await fetch(u,{headers:{"User-Agent":"Mozilla/5.0"}});const x=decodeXml(new Uint8Array(await r.arrayBuffer()));const p=parseFeed(x);const d=p.map(i=>i.date).filter(Boolean).sort().pop();
            console.log(r.status,u,"items:",p.length,"img:",p.filter(i=>i.image).length,"piu_recente:",d,"|",p[0]&&p[0].title.slice(0,70))}catch(e){console.log("ERR",u,e.message)}}})()'
